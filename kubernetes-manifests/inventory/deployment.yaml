apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory
spec:
  replicas: 1
  selector:
    matchLabels:
      app: inventory
  template:
    metadata:
      labels:
        app: inventory
    spec:
      containers:
      - name: inventory
        image: touqeerjadoon55/shipr-inventory:1.0.1
        ports:
        - containerPort: 8000
        envFrom:
        - configMapRef:
            name: redis-config
