apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels:
    app: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      - name: frontend
        image: touqeerjadoon55/reactfrontend:v5
        ports:
        - containerPort: 80
        env:
        - name: REACT_APP_INVENTORY_SERVICE_URL
          value: "http://192.168.49.2:30002"
        - name: REACT_APP_PAYMENTS_SERVICE_URL
          value: "http://192.168.49.2:30003"
        - name: PUBLIC_URL
          value: "/"
