apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payment
  template:
    metadata:
      labels:
        app: payment
    spec:
      containers:
      - name: payment
        image: touqeerjadoon55/shipr-payment:1.0.0
        ports:
        - containerPort: 8001
        envFrom:
        - configMapRef:
            name: redis-config
        env:
        - name: PRODUCT_SERVICE_URL
          value: http://inventory:8000
        - name: FEE_PERCENTAGE
          value: "5"
