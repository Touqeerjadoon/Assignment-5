apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-payment
  labels:
    app: {{ .Release.Name }}-payment
    {{- with .Values.payment.additionalLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    app: {{ .Release.Name }}-payment
  ports:
    - protocol: TCP
      port: 8001
      targetPort: 8001
  type: {{ .Values.payment.service.type | default "ClusterIP" }}