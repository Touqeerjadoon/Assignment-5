apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-payment
  labels:
    app: {{ .Release.Name }}-payment
spec:
  replicas: {{ .Values.payment.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}-payment
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-payment
    spec:
      containers:
      - name: payment
        image: "{{ .Values.payment.image.repository }}:{{ .Values.payment.image.tag }}"
        ports:
        - containerPort: 8001
        envFrom:
        - configMapRef:
            name: {{ .Release.Name }}-payment-config
        env:
        - name: PRODUCT_SERVICE_URL
          value: "{{ .Values.payment.productServiceUrl }}"
        - name: FEE_PERCENTAGE
          value: "{{ .Values.payment.feePercentage }}"