redis:
  replicaCount: 1
  image:
    repository: redis
    tag: latest
    pullPolicy: IfNotPresent
  additionalLabels:
    environment: dev
    team: backend
  podAnnotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "80"
    prometheus.io/path: "/metrics"
    logFormat: "json"
    logLevel: "info"
    loki.io/logs: "true"
    loki.io/format: "json"
  resources:
    requests:
      memory: "128Mi"
      cpu: "250m"
    limits:
      memory: "256Mi"
      cpu: "500m"

inventory:
  replicaCount: 1
  image:
    repository: touqeerjadoon55/shipr-inventory
    tag: 1.0.1
    pullPolicy: IfNotPresent
  service:
    port: 8000
    type: ClusterIP
  additionalLabels:
    environment: dev
    team: backend
  podAnnotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "80"
    prometheus.io/path: "/metrics"
    logFormat: "json"
    logLevel: "info"
    loki.io/logs: "true"
    loki.io/format: "json"
  env:
    REDIS_HOST: shipr-redis
    REDIS_PORT: "6379"
    REDIS_DB: "0"
    ALLOW_ORIGINS: "http://shipr.local"
    ALLOW_METHODS: "*"
    ALLOW_HEADERS: "*"
    PRODUCT_SERVICE_URL: http://shipr.local/inventory
    FEE_PERCENTAGE: "5"
  resources:
    requests:
      memory: "128Mi"
      cpu: "250m"
    limits:
      memory: "256Mi"
      cpu: "500m"

payment:
  replicaCount: 1
  image:
    repository: touqeerjadoon55/shipr-payment
    tag: 1.0.0
    pullPolicy: IfNotPresent
  service:
    port: 8001
    type: ClusterIP
  additionalLabels:
    environment: dev
    team: backend
  podAnnotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "80"
    prometheus.io/path: "/metrics"
    logFormat: "json"
    logLevel: "info"
    loki.io/logs: "true"
    loki.io/format: "json"
  resources:
    requests:
      memory: "128Mi"
      cpu: "250m"
    limits:
      memory: "256Mi"
      cpu: "500m"

frontend:
  replicaCount: 1
  image:
    repository: touqeerjadoon55/shipr
    tag: v5
    pullPolicy: IfNotPresent
  service:
    port: 80
    type: ClusterIP
  additionalLabels:
    environment: dev
    team: frontend
  podAnnotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "80"
    prometheus.io/path: "/metrics"
    logFormat: "json"
    logLevel: "info"
    loki.io/logs: "true"
    loki.io/format: "json"
  resources:
    requests:
      memory: "64Mi"
      cpu: "250m"
    limits:
      memory: "128Mi"
      cpu: "500m"

consumer:
  inventory:
    replicaCount: 1
    image:
      repository: touqeerjadoon55/shipr-inventory-consumer
      tag: 1.0.1
      pullPolicy: IfNotPresent
    redis:
      configMap: shipr-redis-config
    command:
    - python
    - consumer.py
    additionalLabels:
      environment: dev
      team: backend
    podAnnotations:
      prometheus.io/scrape: "true"
      prometheus.io/port: "80"
      prometheus.io/path: "/metrics"
      logFormat: "json"
      logLevel: "info"
      loki.io/logs: "true"
      loki.io/format: "json"
    resources:
      requests:
        memory: "128Mi"
        cpu: "250m"
      limits:
        memory: "256Mi"
        cpu: "500m"

  payment:
    replicaCount: 1
    image:
      repository: touqeerjadoon55/shipr-payment-consumer
      tag: 1.0.0
      pullPolicy: IfNotPresent
    redis:
      configMap: shipr-redis-config
    command:
    - python
    - consumer.py
    additionalLabels:
      environment: dev
      team: backend
    podAnnotations:
      prometheus.io/scrape: "true"
      prometheus.io/port: "80"
      prometheus.io/path: "/metrics"
      logFormat: "json"
      logLevel: "info"
      loki.io/logs: "true"
      loki.io/format: "json"
    resources:
      requests:
        memory: "128Mi"
        cpu: "250m"
      limits:
        memory: "256Mi"
        cpu: "500m"