redis:
  replicaCount: 1
  image:
    repository: redis
    tag: latest
  host: shipr-redis
  port: 6379
  db: 0

inventory:
  replicaCount: 1
  image:
    repository: touqeerjadoon55/shipr-inventory
    tag: 1.0.1
  redis:
    host: shipr-redis
    port: 6379
    db: 0
  allowOrigins: "http://192.168.49.2:30001"
  allowMethods: "*"
  allowHeaders: "*"
  service:
    port: 8000
    nodePort: 30002
    type: NodePort

payment:
  replicaCount: 1
  image:
    repository: touqeerjadoon55/shipr-payment
    tag: 1.0.0
  redis:
    host: shipr-redis
    port: 6379
    db: 0
  productServiceUrl: http://192.168.49.2:30002
  feePercentage: "5"
  allowOrigins: "*"
  allowMethods: "*"
  allowHeaders: "*"
  service:
    port: 8001
    nodePort: 30003
    type: NodePort

frontend:
  replicaCount: 1
  image:
    repository: touqeerjadoon55/frontend-shiprapp
    tag: 1.0.3
  inventory:
    url: http://192.168.49.2:30002
  payment:
    url: http://192.168.49.2:30003
  service:
    port: 80
    nodePort: 30001
    type: NodePort

consumer:
  inventory:
    replicaCount: 1
    image:
      repository: touqeerjadoon55/shipr-inventory-consumer
      tag: 1.0.1
    redis:
      configMap: redis-config
    command:
    - python
    - consumer.py

  payment:
    replicaCount: 1
    image:
      repository: touqeerjadoon55/shipr-payment-consumer
      tag: 1.0.0
    redis:
      configMap: redis-config
    command:
    - python
    - consumer.py
