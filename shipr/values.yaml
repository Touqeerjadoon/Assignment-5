global:
  env:
    REDIS_HOST: shipr-redis
    REDIS_PORT: "6379"
    REDIS_DB: "0"
    ALLOW_ORIGINS: "http://192.168.49.2:30001"
    ALLOW_METHODS: "*"
    ALLOW_HEADERS: "*"
    PRODUCT_SERVICE_URL: http://192.168.49.2:30002
    FEE_PERCENTAGE: "5"

redis:
  replicaCount: 1
  image:
    repository: redis
    tag: latest
    pullPolicy: IfNotPresent
  resources:
    requests:
      memory: "128Mi"
      cpu: "250m"
    limits:
      memory: "256Mi"
      cpu: "500m"

inventory:
  replicaCount: 1
  image:
    repository: touqeerjadoon55/shipr-inventory
    tag: 1.0.1
    pullPolicy: IfNotPresent
  service:
    port: 8000
    nodePort: 30002
    type: NodePort
  resources:
    requests:
      memory: "128Mi"
      cpu: "250m"
    limits:
      memory: "256Mi"
      cpu: "500m"

payment:
  replicaCount: 1
  image:
    repository: touqeerjadoon55/shipr-payment
    tag: 1.0.0
    pullPolicy: IfNotPresent
  service:
    port: 8001
    nodePort: 30003
    type: NodePort
  resources:
    requests:
      memory: "128Mi"
      cpu: "250m"
    limits:
      memory: "256Mi"
      cpu: "500m"

frontend:
  replicaCount: 1
  image:
    repository: touqeerjadoon55/frontend-shiprapp
    tag: 1.0.3
    pullPolicy: IfNotPresent
  inventory:
    url: http://192.168.49.2:30002
  payment:
    url: http://192.168.49.2:30003
  service:
    port: 80
    nodePort: 30001
    type: NodePort
  resources:
    requests:
      memory: "64Mi"
      cpu: "250m"
    limits:
      memory: "128Mi"
      cpu: "500m"

consumer:
  inventory:
    replicaCount: 1
    image:
      repository: touqeerjadoon55/shipr-inventory-consumer
      tag: 1.0.1
      pullPolicy: IfNotPresent
    redis:
      configMap: shipr-redis-config
    command:
    - python
    - consumer.py
    resources:
      requests:
        memory: "128Mi"
        cpu: "250m"
      limits:
        memory: "256Mi"
        cpu: "500m"

  payment:
    replicaCount: 1
    image:
      repository: touqeerjadoon55/shipr-payment-consumer
      tag: 1.0.0
      pullPolicy: IfNotPresent
    redis:
      configMap: shipr-redis-config
    command:
    - python
    - consumer.py
    resources:
      requests:
        memory: "128Mi"
        cpu: "250m"
      limits:
        memory: "256Mi"
        cpu: "500m"
